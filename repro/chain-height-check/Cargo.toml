[package]
name = "chain-height-check"
version = "0.0.0"
edition = "2021"

[workspace]

[dependencies]
zcash_client_backend = { version = "=0.25.0", default-features = false, features = ["sync", "lightwalletd-tonic", "orchard", "zeroize"] }
zcash_client_memory = { git = "https://github.com/red-dev-inc/zcash_client_memory", rev = "b4c8f0d33c65c5bab4155ddeba4f201ea2d28c43", features = ["orchard", "transparent-inputs"] }
zcash_protocol = "=0.11.0"
zcash_keys = { version = "=0.17.0", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_primitives = "=0.31.0"
zip32 = "0.3"
tonic = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt", "macros", "time"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
prost = "0.14"
tower-service = "0.3"
futures-util = "0.3"
hex = "0.4"
