[package]
name = "scan-hang-repro"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rayon = "1"
zcash_client_backend = { version = "=0.25.0", default-features = false, features = ["orchard"] }
zcash_client_memory = { git = "https://github.com/red-dev-inc/zcash_client_memory", rev = "b4c8f0d3", default-features = false, features = ["orchard"] }
zcash_keys = { version = "=0.17.0", features = ["orchard", "sapling"] }
zcash_protocol = { version = "=0.11.0", default-features = false }
zip32 = "0.3"
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std", "circuits"] }
